[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quran-video-pipeline"
version = "0.1.0"
description = "Automated Quran video repurposing and publishing pipeline."
readme = "SPEC.md"
requires-python = ">=3.11"
dependencies = [
  "telethon>=1.39,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["pipeline*"]
