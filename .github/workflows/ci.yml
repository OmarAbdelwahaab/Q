name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite (Linux)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pipeline
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      STATE_DATABASE_URL: postgresql://pipeline:pipeline@localhost:5432/pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies (ffmpeg & postgresql-client)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg postgresql-client

      - name: Initialize PostgreSQL schema
        run: |
          PGPASSWORD=pipeline psql -h localhost -U pipeline -d pipeline -f pipeline/state/schema.sql

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev] "psycopg[binary]>=3.1" "psycopg_pool>=3.1"

      - name: Run test suite via unittest (portable stdlib discovery)
        run: |
          python -m unittest discover -s pipeline/tests -v

      - name: Run test suite via pytest
        run: |
          pytest -v
