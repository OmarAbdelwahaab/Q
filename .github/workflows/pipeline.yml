name: Quran Video Pipeline (Autonomous Poller)

on:
  schedule:
    # Run every 30 minutes automatically
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum number of recent channel messages to check'
        required: false
        default: '10'
      channel_id:
        description: 'Telegram Channel username (@channel), numeric ID (-100...), or private invite link'
        required: false
        default: 'moathemam'

concurrency:
  group: quran-pipeline-execution
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl

      - name: Install PyTorch (CPU) & Alignment Tools
        run: |
          pip install --upgrade pip
          pip install torch torchaudio --extra-index-url https://download.pytorch.org/whl/cpu
          pip install git+https://github.com/MahmoudAshraf97/ctc-forced-aligner.git
          pip install -e .

      - name: Restore Pipeline State Database
        run: |
          mkdir -p pipeline/state storage
          git fetch origin pipeline-state:refs/remotes/origin/pipeline-state 2>/dev/null || true
          if git rev-parse --verify origin/pipeline-state >/dev/null 2>&1; then
            echo "Restoring pipeline.db from pipeline-state branch..."
            git show origin/pipeline-state:pipeline/state/pipeline.db > pipeline/state/pipeline.db 2>/dev/null || true
          else
            echo "No prior pipeline-state branch found; starting with fresh database."
          fi

      - name: Validate Required Secrets and Configuration
        run: |
          MISSING=""
          if [ -z "${{ secrets.ASR_API_KEY }}" ]; then
            echo "::error title=Missing Secret::Secret 'ASR_API_KEY' is missing or empty! Please add your Groq API key in Settings -> Secrets and variables -> Actions."
            MISSING="1"
          fi
          if [ -z "${{ secrets.TELEGRAM_API_ID }}" ]; then
            echo "::error title=Missing Secret::Secret 'TELEGRAM_API_ID' is missing or empty! Please add your Telegram API ID in Settings -> Secrets and variables -> Actions."
            MISSING="1"
          fi
          if [ -z "${{ secrets.TELEGRAM_API_HASH }}" ]; then
            echo "::error title=Missing Secret::Secret 'TELEGRAM_API_HASH' is missing or empty! Please add your Telegram API Hash in Settings -> Secrets and variables -> Actions."
            MISSING="1"
          fi
          if [ -z "${{ secrets.TELEGRAM_SESSION_STRING }}" ]; then
            echo "::error title=Missing Secret::Secret 'TELEGRAM_SESSION_STRING' is missing or empty! In GitHub Actions, interactive login is impossible. Run 'python scripts/generate_session_string.py' on your computer to log in once, then paste the output string into Settings -> Secrets and variables -> Actions."
            MISSING="1"
          fi

          CHANNEL="${{ github.event.inputs.channel_id || vars.TELEGRAM_CHANNEL_ID || 'moathemam' }}"
          if [ -z "$CHANNEL" ]; then
            echo "::error title=Channel Not Configured::TELEGRAM_CHANNEL_ID is not configured! Please set your Telegram channel username (e.g. @moathemam or -100...) in Settings -> Secrets and variables -> Actions -> Variables -> 'TELEGRAM_CHANNEL_ID', or enter it in the 'channel_id' input field when clicking 'Run workflow'."
            MISSING="1"
          fi

          if [ -n "$MISSING" ]; then
            echo "::error::Required configuration is missing. Stopping workflow before executing pipeline."
            exit 1
          fi

      - name: Run Autonomous Ingestion & Pipeline Poller
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_CHANNEL_ID: ${{ github.event.inputs.channel_id || vars.TELEGRAM_CHANNEL_ID || 'moathemam' }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          AUTO_ORCHESTRATE: "true"
          ASR_API_URL: ${{ vars.ASR_API_URL || 'https://api.groq.com/openai/v1/audio/transcriptions' }}
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
          ASR_MODEL_NAME: ${{ vars.ASR_MODEL_NAME || 'whisper-large-v3' }}
          ALIGNER_BINARY: "ctc-forced-aligner"
          ALIGNMENT_MODEL: "jonatasgrosman/wav2vec2-large-xlsr-53-arabic"
          ALIGNMENT_DEVICE: "cpu"
          BRANDING_HANDLE: ${{ vars.BRANDING_HANDLE || '@YourChannel' }}
          PUBLISH_DRAFT_MODE: ${{ vars.PUBLISH_DRAFT_MODE || 'true' }}
          ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
          STATE_DB_PATH: "pipeline/state/pipeline.db"
          PIPELINE_PROJECT_ROOT: "."
          PIPELINE_STORAGE_ROOT: "storage"
        run: |
          python -m pipeline.ingestion.poll --limit ${{ github.event.inputs.limit || '10' }}

      - name: Persist Pipeline State Database to Git Branch
        if: always()
        run: |
          if [ -f "pipeline/state/pipeline.db" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            # Stash any storage or untracked artifacts before switching branch
            git stash --include-untracked || true
            
            # Fetch or create pipeline-state branch
            git fetch origin pipeline-state:pipeline-state 2>/dev/null || git checkout --orphan pipeline-state
            git checkout pipeline-state 2>/dev/null || git checkout -b pipeline-state
            
            # Restore the updated pipeline.db from stash
            git checkout stash -- pipeline/state/pipeline.db 2>/dev/null || true
            git add -f pipeline/state/pipeline.db
            
            if ! git diff --cached --quiet; then
              git commit -m "chore(state): persist pipeline.db execution state [skip ci]"
              git push origin pipeline-state
              echo "Pipeline state successfully committed and pushed to pipeline-state branch."
            else
              echo "No state database modifications to commit."
            fi
          fi
