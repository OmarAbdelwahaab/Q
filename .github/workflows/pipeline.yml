name: Quran Video Pipeline (Autonomous Poller)

on:
  schedule:
    # Run every 30 minutes automatically
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum number of recent channel messages to check'
        required: false
        default: '10'
      max_downloads:
        description: 'Maximum new videos to download and process in this run'
        required: false
        default: '2'
      channel_id:
        description: 'Telegram Channel username (@channel), numeric ID (-100...), or private invite link'
        required: false
        default: 'moathemam'

concurrency:
  group: quran-pipeline-execution
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl

      - name: Install PyTorch (CPU) & Alignment Tools
        run: |
          pip install --upgrade pip
          pip install torch torchaudio --extra-index-url https://download.pytorch.org/whl/cpu
          pip install git+https://github.com/MahmoudAshraf97/ctc-forced-aligner.git
          pip install -e .

      - name: Restore Pipeline State Database
        run: |
          mkdir -p pipeline/state storage
          git fetch origin pipeline-state:refs/remotes/origin/pipeline-state 2>/dev/null || true
          if git rev-parse --verify origin/pipeline-state >/dev/null 2>&1; then
            echo "Restoring pipeline.db from pipeline-state branch..."
            git show origin/pipeline-state:pipeline/state/pipeline.db > pipeline/state/pipeline.db 2>/dev/null || true
          else
            echo "No prior pipeline-state branch found; starting with fresh database."
          fi

      - name: Validate Required Secrets and Configuration
        env:
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_CHANNEL_ID: ${{ github.event.inputs.channel_id || vars.TELEGRAM_CHANNEL_ID || 'moathemam' }}
          ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
          ALIGNMENT_DEVICE: "cpu"
        run: |
          python scripts/validate_env.py

      - name: Run Autonomous Ingestion & Pipeline Poller
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_CHANNEL_ID: ${{ github.event.inputs.channel_id || vars.TELEGRAM_CHANNEL_ID || 'moathemam' }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          AUTO_ORCHESTRATE: "true"
          ASR_API_URL: ${{ vars.ASR_API_URL || 'https://api.groq.com/openai/v1/audio/transcriptions' }}
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
          ASR_MODEL_NAME: ${{ vars.ASR_MODEL_NAME || 'whisper-large-v3' }}
          ALIGNER_BINARY: "ctc-forced-aligner"
          ALIGNMENT_MODEL: "jonatasgrosman/wav2vec2-large-xlsr-53-arabic"
          ALIGNMENT_DEVICE: "cpu"
          CTC_ALIGNMENT_DEVICE: "cpu"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BRANDING_HANDLE: ${{ vars.BRANDING_HANDLE || '@YourChannel' }}
          PUBLISH_DRAFT_MODE: ${{ vars.PUBLISH_DRAFT_MODE || 'true' }}
          ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
          STATE_DB_PATH: "pipeline/state/pipeline.db"
          PIPELINE_PROJECT_ROOT: "."
          PIPELINE_STORAGE_ROOT: "storage"
        run: |
          python -m pipeline.ingestion.poll --limit ${{ github.event.inputs.limit || '10' }} --max-downloads ${{ github.event.inputs.max_downloads || '2' }}

      - name: Persist Pipeline State Database to Git Branch
        if: always()
        run: |
          if [ -f "pipeline/state/pipeline.db" ]; then
            STATE_DIR=$(mktemp -d)
            cd "$STATE_DIR"
            git init
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            git fetch --depth=1 "$REPO_URL" pipeline-state:pipeline-state 2>/dev/null || true
            git checkout pipeline-state 2>/dev/null || git checkout -b pipeline-state

            mkdir -p pipeline/state
            cp "$GITHUB_WORKSPACE/pipeline/state/pipeline.db" pipeline/state/pipeline.db
            git add pipeline/state/pipeline.db

            if ! git diff --cached --quiet; then
              git commit -m "chore(state): persist pipeline.db execution state [skip ci]"
              git push "$REPO_URL" pipeline-state
              echo "Pipeline state successfully committed and pushed to pipeline-state branch."
            else
              echo "No state database modifications to commit."
            fi
            cd "$GITHUB_WORKSPACE"
            rm -rf "$STATE_DIR"
          fi
